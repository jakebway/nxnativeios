name: Player shells

# One game-less player shell per nxnative game profile (no game data anywhere), with the profile itself, on the shells-data branch
# under <nxnative commit>/: shell-<title ID>.zip and profile-<title ID>.zip. The phone downloads the pair for the game it builds, once.
# With no title IDs it builds every profile nxnative has that is not on the branch yet for this commit.
on:
  workflow_dispatch:
    inputs:
      games:
        description: "Title IDs, space separated (empty = every game nxnative supports that has no shell yet)"
        default: ""
      force:
        description: "Rebuild even the ones already built"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [ci/nxnative.commit, patches/**, tools/build_shell.py]

permissions:
  contents: write

concurrency:
  group: shells
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.g.outputs.games }}
      commit: ${{ steps.g.outputs.commit }}
      count: ${{ steps.g.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          c=$(cat ci/nxnative.commit)
          list="${{ inputs.games }}"
          if [ -z "$list" ]; then
            git clone -q --filter=blob:none --no-checkout https://github.com/seedds/nxnative.git up
            list=$(git -C up ls-tree --name-only "$c" dm/games/ | sed -n 's|^dm/games/\([0-9A-F]\{16\}\)$|\1|p')
          fi
          if [ "${{ inputs.force }}" != "true" ]; then   # skip the ones this commit already has
            have=$(git ls-remote --exit-code origin shells-data >/dev/null 2>&1 && { git fetch -q --depth 1 origin shells-data && git ls-tree --name-only FETCH_HEAD "$c/" | sed -n 's|.*/shell-\([0-9A-F]\{16\}\)\.zip$|\1|p'; } || true)
            list=$(printf '%s\n' $list | grep -vxF -f <(printf '%s\n' $have) || true)
          fi
          n=$(printf '%s\n' $list | grep -c . || true)
          echo "games: $n"; printf '%s\n' $list | head -300
          echo "games=$(printf '%s\n' $list | grep . | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "commit=$c" >> "$GITHUB_OUTPUT"

  shell:
    needs: list
    if: needs.list.outputs.count != '0'
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        game: ${{ fromJson(needs.list.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - name: nxnative at a pinned commit, with our patches
        run: |
          git clone https://github.com/seedds/nxnative.git upstream
          git -C upstream checkout ${{ needs.list.outputs.commit }}
          git -C upstream apply "$PWD"/patches/*.patch
      - run: command -v xcodegen || brew install xcodegen
      - name: fontTools (make_ext_font.py makes the Nintendo button font)
        run: python3 -c 'import fontTools' 2>/dev/null || python3 -m pip install fonttools || python3 -m pip install --break-system-packages fonttools
      - name: Build the shell
        env:
          GAME: ${{ matrix.game }}
          NXNATIVE: upstream
        run: python3 tools/build_shell.py --output "$RUNNER_TEMP/shell" --zip "out/shell-${{ matrix.game }}.zip" 2>&1 | tee shell.log
      - name: "Publish to the shells-data branch (not a release, so the Releases page stays clean)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          g=${{ matrix.game }}; c=${{ needs.list.outputs.commit }}
          W=$PWD; z="$W/out/shell-$g.zip"; p="$W/out/profile-$g.zip"
          (cd upstream/dm/games && zip -qr -9 "$p" "$g" -x '*/__pycache__/*')
          d=$(mktemp -d); cd $d
          git init -q; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in $(seq 1 12); do
            if git fetch -q --depth 1 origin shells-data; then git checkout -q -f -B shells-data FETCH_HEAD; else git checkout -q --orphan shells-data; fi
            mkdir -p "$c"; cp "$z" "$p" "$c/"
            git add -A; git commit -q -m "shell $g (nxnative $c)" || true
            git push -q origin shells-data && exit 0 || sleep $((RANDOM % 20 + 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-${{ matrix.game }}
          path: shell.log
