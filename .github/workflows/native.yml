name: Native tools (iOS frameworks)

# nxnative's C# tools as one iOS framework the builder app calls: NxTools (nx_extract: NSP/XCI extraction with your prod.keys; dmsh_xlate: shader translation).
on:
  push:
    paths: ['native/**', 'ci/**', 'tools/test_nxtools_lib.py', 'tools/test_spirvcross_lib.py', 'tools/test_oodle_lib.py', 'tools/testdata/**', '.github/workflows/native.yml', 'patches/**']
  workflow_dispatch:
  workflow_call:

jobs:
  nxtools:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ci/prepare_upstream.sh
      - name: macOS build + call test
        run: |
          dotnet publish native/NxTools/NxTools.csproj -c Release -r osx-arm64 -nologo -o out/osx -p:UPSTREAM="$PWD/upstream"
          python3 tools/test_nxtools_lib.py out/osx/NxTools.dylib upstream
      - name: iOS framework
        run: |
          dotnet publish native/NxTools/NxTools.csproj -c Release -r ios-arm64 -nologo -o out/ios -p:UPSTREAM="$PWD/upstream"
          ls -la out/ios
          fw=out/NxTools.framework; mkdir -p $fw
          cp out/ios/NxTools.dylib $fw/NxTools
          install_name_tool -id @rpath/NxTools.framework/NxTools $fw/NxTools
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string org.nxnativeios.NxTools' -c 'Add :CFBundleExecutable string NxTools' \
            -c 'Add :CFBundlePackageType string FMWK' -c 'Add :CFBundleVersion string 1' -c 'Add :CFBundleShortVersionString string 1.0' \
            -c 'Add :MinimumOSVersion string 26.0' $fw/Info.plist
          otool -l $fw/NxTools | grep -A4 LC_BUILD_VERSION
          nm -gU $fw/NxTools | grep -E '_(nx_extract|dmsh_xlate)_main'
          codesign -s - -f $fw && codesign -v $fw
          du -sh $fw
          (cd out && ditto -c -k --keepParent NxTools.framework NxTools.framework.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: NxTools.framework
          path: out/NxTools.framework.zip

  spirvcross:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ci/prepare_upstream.sh
      - run: command -v glslangValidator || brew install glslang
      - name: macOS build, compared with nxnative's pinned spirv-cross
        run: |
          native/SpirvCross/build.sh macos out
          for s in tools/testdata/*.frag tools/testdata/*.comp; do glslangValidator -V "$s" -o "out/$(basename $s).spv"; done
          python3 tools/test_spirvcross_lib.py out/libSpirvCross-macos.dylib upstream/dm/gfx/tools/spirv_cross_bin/spirv-cross out/*.spv
      - name: iOS framework
        run: |
          native/SpirvCross/build.sh ios out
          fw=out/SpirvCross.framework; mkdir -p $fw
          cp out/libSpirvCross-ios.dylib $fw/SpirvCross
          install_name_tool -id @rpath/SpirvCross.framework/SpirvCross $fw/SpirvCross
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string org.nxnativeios.SpirvCross' -c 'Add :CFBundleExecutable string SpirvCross' \
            -c 'Add :CFBundlePackageType string FMWK' -c 'Add :CFBundleVersion string 1' -c 'Add :CFBundleShortVersionString string 1.0' \
            -c 'Add :MinimumOSVersion string 26.0' $fw/Info.plist
          otool -l $fw/SpirvCross | grep -A4 LC_BUILD_VERSION
          nm -gU $fw/SpirvCross | grep spirv_cross_main
          codesign -s - -f $fw && codesign -v $fw && du -sh $fw
          (cd out && ditto -c -k --keepParent SpirvCross.framework SpirvCross.framework.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: SpirvCross.framework
          path: out/SpirvCross.framework.zip

  unrar:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: macOS build (compiles, exports the RAR API)
        run: native/Unrar/build.sh macos out
      - name: iOS framework
        run: |
          native/Unrar/build.sh ios out
          fw=out/Unrar.framework; mkdir -p $fw
          cp out/libUnrar-ios.dylib $fw/Unrar
          install_name_tool -id @rpath/Unrar.framework/Unrar $fw/Unrar
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string org.nxnativeios.Unrar' -c 'Add :CFBundleExecutable string Unrar' \
            -c 'Add :CFBundlePackageType string FMWK' -c 'Add :CFBundleVersion string 1' -c 'Add :CFBundleShortVersionString string 1.0' \
            -c 'Add :CFBundleSupportedPlatforms array' -c 'Add :CFBundleSupportedPlatforms:0 string iPhoneOS' \
            -c 'Add :MinimumOSVersion string 26.0' $fw/Info.plist
          otool -l $fw/Unrar | grep -A4 LC_BUILD_VERSION
          codesign -s - -f $fw && codesign -v $fw && du -sh $fw
          (cd out && ditto -c -k --keepParent Unrar.framework Unrar.framework.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: Unrar.framework
          path: out/Unrar.framework.zip

  oodle:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: macOS arm64 build, decoded against ooz's own test streams (Kraken, Mermaid, Selkie, Leviathan must agree) and an LZ5 round trip
        run: |
          OODLE_TEST=1 native/Oodle/build.sh macos out
          # the test streams are Powzix's (ooz's original repository): the same files in every format, a few of them
          mkdir out/oozdata && cd out/oozdata && git init -q && git remote add origin https://github.com/powzix/ooz
          git sparse-checkout set --no-cone '/testdata/dickens.*' '/testdata/xml.*' '/testdata/mr.*' '/testdata/nci.*' '/testdata/osdb.*'
          git fetch -q --depth 1 --filter=blob:none origin 05038060aa68f9187ae9923b2388ca8db40e58d1
          git checkout -q FETCH_HEAD; cd ../..
          python3 tools/test_oodle_lib.py out/libOodle-macos.dylib out/oozdata/testdata || { echo '--- the same at -O0'; OODLE_OPT=-O0 OODLE_TEST=1 native/Oodle/build.sh macos out0 >/dev/null; python3 tools/test_oodle_lib.py out0/libOodle-macos.dylib out/oozdata/testdata | tail -8; exit 1; }
      - name: the phone's stand-in for the Mac host, driven by nxnative's own scripts (uepak.OodleHost, shader_split.oodle_ask, a job file)
        run: |
          ci/prepare_upstream.sh
          NXB_OODLE_LIB=$PWD/out/libOodle-macos.dylib python3 tools/test_oodle_phone.py upstream out/oozdata/testdata
      - name: iOS framework
        run: |
          native/Oodle/build.sh ios out
          fw=out/Oodle.framework; mkdir -p $fw
          cp out/libOodle-ios.dylib $fw/Oodle
          install_name_tool -id @rpath/Oodle.framework/Oodle $fw/Oodle
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string org.nxnativeios.Oodle' -c 'Add :CFBundleExecutable string Oodle' \
            -c 'Add :CFBundlePackageType string FMWK' -c 'Add :CFBundleVersion string 1' -c 'Add :CFBundleShortVersionString string 1.0' \
            -c 'Add :CFBundleSupportedPlatforms array' -c 'Add :CFBundleSupportedPlatforms:0 string iPhoneOS' \
            -c 'Add :MinimumOSVersion string 26.0' $fw/Info.plist
          otool -l $fw/Oodle | grep -A4 LC_BUILD_VERSION
          nm -gU $fw/Oodle | grep -E '_nxb_(oodle|lz5)_decompress'
          codesign -s - -f $fw && codesign -v $fw && du -sh $fw
          (cd out && ditto -c -k --keepParent Oodle.framework Oodle.framework.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: Oodle.framework
          path: out/Oodle.framework.zip
