name: NXnativeiOS
options:
  bundleIdPrefix: org.nxnativeios
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NXnativeiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: NXData
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/Python.xcframework
        embed: true
      - framework: Frameworks/NxTools.framework
        embed: true
        link: false   # loaded by Python's ctypes at run time
      - framework: Frameworks/SpirvCross.framework
        embed: true
        link: false   # loaded by Python's ctypes at run time
      - framework: Frameworks/Unrar.framework
        embed: true
        link: false   # loaded by Python's ctypes at run time (RAR archives)
      - framework: Frameworks/capstone.framework
        embed: true
        link: false   # loaded by Python's ctypes at run time
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxnativeios.builder
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Frameworks/Python.xcframework/ios-arm64/Python.framework/Headers"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: NXnativeiOS
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [processing]
